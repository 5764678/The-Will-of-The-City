<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Will of The City</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- PWA: installable manifest, icons, and iOS-specific meta (iOS ignores the manifest's
         icons/theme-color, hence the separate apple-* tags) -->
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="shortcut icon" href="/static/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Will of the City">
</head>

<body>
    <a href="/menu/" class="menu-toggle" aria-label="Open menu">☰</a>

    <div id="terminal">
        <div>prescript device</div>
    </div>

    <div id="userGreeting" class="user-greeting"></div>
    <div id="prescript" data-text="{{ prescript|escapejs }}">{{ prescript }}</div>
    <button id="completeBtn" onclick="completePrescript()">Complete</button>
    <button id="ignoreBtn" onclick="ignorePrescript()">Ignore</button>

    <div id="grace">Grace: {{ grace }}</div>
    <div id="status" style="min-height: 35px;"></div>

    <!-- Beep sound used by status animation -->
    <audio id="beep" src="/static/limbus_index_beeper.mp3" preload="auto"></audio>

    <img src="/static/detailed_index_logo.webp" alt="" width="363" height="426" class="home-logo">

    <script src="/static/script.js"></script>
    <script src="/static/pwa.js"></script>
</body>

</html>
