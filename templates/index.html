{% extends "base.html" %}
{% load static %}
{% block title %}Prescripts · The Will of The City{% endblock %}
{% block page_id %}home{% endblock %}
{% block main_class %}page--home{% endblock %}

{% block content %}
<section class="device panel" aria-labelledby="deviceTitle">
    <img src="{% static 'index_logo.webp' %}" alt="" class="device__watermark" width="363" height="426">

    <div class="device__head">
        <!-- The Index Device toggle — flips between Operational (accepting new prescripts) and
             Standby (see toggleDevice in script.js and accepting_prescripts on UserProfile). -->
        <button id="terminal" type="button" class="device-switch" aria-pressed="true">
            <span class="device-switch__led" aria-hidden="true"></span>
            <span class="device-switch__label">Index Device</span>
            <span class="device-switch__state" id="deviceStatusText">Operational</span>
        </button>
        <div class="device__clock" aria-label="City time">
            <span class="device__clock-label">City time</span>
            <span id="deviceClock">--:--:--</span>
        </div>
    </div>

    <h1 id="deviceTitle" class="device__greeting"><span id="userGreeting">Citizen</span></h1>

    <div class="grace-readout">
        <div class="grace-readout__label">Grace</div>
        <div class="grace-readout__value" id="grace" data-value="{{ grace }}">{{ grace }}</div>
        <div class="grace-readout__delta" id="graceDelta" aria-hidden="true"></div>
    </div>

    <a href="/role/" class="rank-progress" id="rankProgress">
        <span class="rank-progress__row">
            <span class="rank-progress__rank" id="rankName">Civilian</span>
            <span class="rank-progress__next" id="rankNext">&nbsp;</span>
        </span>
        <span class="meter"><span class="meter__fill" id="rankBar"></span></span>
    </a>

    <button id="requestPrescriptBtn" type="button" class="btn btn--primary btn--xl">
        <span class="btn__label">Receive Prescript</span>
    </button>

    <div id="status" class="status-line" role="status" aria-live="polite"></div>
</section>

<section class="inbox-section" aria-labelledby="inboxTitle">
    <div class="section-head">
        <h2 id="inboxTitle">Inbox</h2>
        <span class="count-badge" id="inboxCount" hidden>0</span>
    </div>

    <!-- Inbox: every unresolved prescript (scheduled push or self-requested) shows here as its
         own card, newest on top. Populated client-side by loadInbox() in script.js — see
         get_inbox/request_prescript in views.py. -->
    <div id="inbox" class="inbox"></div>
</section>
{% endblock %}
