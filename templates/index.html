{% extends "base.html" %}
{% load static %}
{% block title %}Prescripts · The Will of The City{% endblock %}
{% block page_id %}home{% endblock %}

{% block content %}
<h1 class="cmdline"><span class="prompt__caret">&gt;</span> prescript --queue</h1>

<section class="block print" aria-label="Device status">
    <div class="kv"><span class="kv__k">designation</span><span class="kv__v bright" id="userGreeting">CITIZEN</span></div>
    <div class="kv">
        <span class="kv__k">grace</span>
        <span class="kv__v"><span class="bright" id="grace">{{ grace }}</span> <span class="delta" id="graceDelta" aria-hidden="true"></span></span>
    </div>
    <div class="kv">
        <span class="kv__k">standing</span>
        <span class="kv__v"><a href="/role/" class="bright" id="rankName">CIVILIAN</a> <span class="dim" id="rankNext"></span></span>
    </div>
    <div class="kv">
        <span class="kv__k">device</span>
        <span class="kv__v">
            <!-- Index Device toggle — Operational (accepting new prescripts) / Standby. See
                 toggleDevice in script.js and accepting_prescripts on UserProfile. -->
            <button id="terminal" type="button" class="cmd cmd--inline" aria-pressed="true" title="Toggle Operational / Standby">
                <span class="visually-hidden">Index Device: </span><span id="deviceStatusText">OPERATIONAL</span>
            </button>
        </span>
    </div>
</section>

<!-- The queue: every unresolved prescript (get_inbox / request_prescript in views.py), one on
     screen at a time, paged with ← →. Everything inside #queueBody is rendered by script.js. -->
<section class="block" aria-labelledby="queueTitle">
    <div class="rule"><span id="queueTitle">QUEUE <span id="screenCounter">00/00</span></span></div>

    <div class="queue" id="queue">
        <div class="queue__body" id="queueBody" aria-live="polite"></div>

        <div class="queue__actions">
            <button type="button" class="cmd" id="keyComplete"><span class="cmd__key">C</span>COMPLETE</button>
            <button type="button" class="cmd cmd--fail" id="keyIgnore"><span class="cmd__key">I</span>IGNORE</button>
            <span class="queue__nav">
                <button type="button" class="cmd" id="keyPrev" aria-label="Previous prescript">&larr;</button>
                <button type="button" class="cmd" id="keyNext" aria-label="Next prescript">&rarr;</button>
            </span>
        </div>
    </div>

    <div class="prompt">
        <span class="prompt__caret">&gt;</span>
        <button id="requestPrescriptBtn" type="button" class="cmd cmd--plain"><span class="cmd__key">R</span>RECEIVE PRESCRIPT</button>
        <span class="cursor" aria-hidden="true"></span>
    </div>
</section>

<section class="block" aria-labelledby="logTitle">
    <div class="rule"><span id="logTitle">LOG</span></div>
    <ol class="log" id="deviceLog"></ol>
</section>

<div id="status" class="visually-hidden" role="status" aria-live="polite"></div>
{% endblock %}
