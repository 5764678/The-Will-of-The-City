<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Menu</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="shortcut icon" href="/static/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Will of the City">
</head>
<body class="menu-page">

    <a href="/home/" class="menu-toggle" aria-label="Go to Prescript's">←</a>

    <div class="menu">
        <div class="menu-left">
            <img src="/static/index_logo.webp" alt="Logo" class="menu-logo">
            <div class="menu-username">
                <label for="usernameInput">Your name</label>
                <input id="usernameInput" type="text" placeholder="Enter your name" autocomplete="name">
                <button id="btnSave">Save</button>
            </div>

            <div id="installBanner" class="notify-banner" style="display: none;">
                Add this to your Home Screen to receive prescripts as notifications: tap
                <strong>Share</strong> → <strong>Add to Home Screen</strong>, then open it from
                there.
            </div>

            <div class="notify-controls">
                <button id="installAppBtn" style="display: none;">Install App</button>
                <button id="enableNotifyBtn" style="display: none;">Enable Notifications</button>
                <div id="notifyStatus" class="notify-status"></div>
            </div>
        </div>
        <div class="menu-right">
            <h2>Navigation</h2>
            <nav class="menu-nav">
                {% for link in menu_links %}
                    <a href="{{ link.url }}" class="menu-link">{{ link.label }}</a>
                {% endfor %}
            </nav>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script src="/static/pwa.js"></script>
</body>
</html>
