{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}The Will of The City{% endblock %}</title>
    <meta name="description" content="A prescript device inspired by The Index (Project Moon). Receive prescripts, keep your grace, rise through the ranks.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <!-- PWA: installable manifest, icons, and iOS-specific meta (iOS ignores the manifest's
         icons/theme-color, hence the separate apple-* tags) -->
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="shortcut icon" href="/static/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Will of the City">
</head>

<body data-page="{% block page_id %}{% endblock %}">
    <!-- The whole viewport is the device's screen: faint scanlines and a vignette over everything. -->
    <div class="crt" aria-hidden="true"></div>

    <a class="skip-link" href="#main">Skip to content</a>

    {% with path=request.path %}
    <header class="statusbar">
        <a href="/home/" class="statusbar__brand">INDEX<span class="dim">//</span>WILL OF THE CITY</a>

        <nav class="nav" aria-label="Primary">
            <a href="/home/" data-key="1" class="nav__link{% if path == '/home/' %} is-active{% endif %}"{% if path == '/home/' %} aria-current="page"{% endif %}><span class="nav__key">1</span>Prescripts</a>
            <a href="/role/" data-key="2" class="nav__link{% if path == '/role/' %} is-active{% endif %}"{% if path == '/role/' %} aria-current="page"{% endif %}><span class="nav__key">2</span>Role</a>
            <a href="/history/" data-key="3" class="nav__link{% if path == '/history/' %} is-active{% endif %}"{% if path == '/history/' %} aria-current="page"{% endif %}><span class="nav__key">3</span>History</a>
            <a href="/about/" data-key="4" class="nav__link{% if path == '/about/' %} is-active{% endif %}"{% if path == '/about/' %} aria-current="page"{% endif %}><span class="nav__key">4</span>About</a>
            <a href="/menu/" data-key="5" class="nav__link{% if path == '/menu/' or path == '/' %} is-active{% endif %}"{% if path == '/menu/' or path == '/' %} aria-current="page"{% endif %}><span class="nav__key">5</span>Terminal</a>
        </nav>

        <div class="statusbar__right">
            <a href="/role/" class="statusbar__item" title="Your grace">GRACE <span id="graceChip" class="bright">{{ grace|default:"--" }}</span></a>
            <span class="statusbar__item statusbar__clock" id="statusClock" aria-hidden="true">--:--:--</span>
            <button type="button" class="statusbar__item statusbar__btn" id="soundToggle" aria-pressed="true" title="Toggle sound">SND <span id="soundState">ON</span></button>
        </div>
    </header>
    {% endwith %}

    <main id="main" class="screen">
        {% block content %}{% endblock %}
    </main>

    <!-- First-visit-per-session boot sequence, on whichever page the session starts (see runBoot
         in script.js). Tap or any key skips it. -->
    <div class="boot" id="boot" hidden>
        <img src="{% static 'index_logo.webp' %}" alt="" class="boot__logo" width="120" height="141">
        <pre class="boot__lines" id="bootLines"></pre>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <audio id="beep" src="{% static 'limbus_index_beeper.mp3' %}" preload="auto"></audio>

    <script src="{% static 'script.js' %}"></script>
    <script src="{% static 'pwa.js' %}"></script>
</body>
</html>
