{% extends "base.html" %}
{% block title %}History · The Will of The City{% endblock %}
{% block page_id %}history{% endblock %}

{% block content %}
<h1 class="cmdline"><span class="prompt__caret">&gt;</span> record --owner <span class="bright" id="recordOwner">CITIZEN</span></h1>

<section class="block print" aria-label="Summary">
    <div class="kv"><span class="kv__k">issued</span><span class="kv__v bright" id="statTotal">0</span></div>
    <div class="kv"><span class="kv__k">cleared</span><span class="kv__v bright" id="statCompleted">0</span></div>
    <div class="kv"><span class="kv__k">ignored</span><span class="kv__v fail" id="statIgnored">0</span></div>
    <div class="kv"><span class="kv__k">streak</span><span class="kv__v bright" id="statStreak">0</span></div>
    <div class="kv"><span class="kv__k">compliance</span><span class="kv__v"><span class="bright"><span id="statRate">0</span>%</span></span></div>
    <div class="textbar" id="rateBar" aria-hidden="true"></div>
</section>

<section class="block">
    <div class="rule"><span>ENTRIES <span id="recordCount">0</span></span></div>

    <div class="filter" role="tablist" aria-label="Filter history">
        <span class="dim">query --filter=</span>
        <button type="button" role="tab" class="cmd cmd--inline segmented__btn is-active" aria-selected="true" data-filter="all">all</button>
        <button type="button" role="tab" class="cmd cmd--inline segmented__btn" aria-selected="false" data-filter="completed">cleared</button>
        <button type="button" role="tab" class="cmd cmd--inline segmented__btn" aria-selected="false" data-filter="ignored">ignored</button>
    </div>

    <div id="history" class="entries">
        <p class="dim">reading record<span class="cursor"></span></p>
    </div>
</section>
{% endblock %}
