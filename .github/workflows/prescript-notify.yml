name: Send prescript notifications

# The actual schedule now lives on cron-job.org, calling /notify/trigger/ directly (confirmed
# live and firing reliably — see the project history around 2026-08-29 for the measurement that
# led to switching). This workflow's own `schedule:` trigger is deliberately removed rather than
# left running alongside it: notify_trigger's due-check (SWEEP_INTERVAL / _missed_sweep_count in
# views.py) makes it *safe* for more than one caller to hit the endpoint — a call arriving before
# a recipient's next slot is genuinely due just finds nothing to do — but there's no reason to
# keep two schedulers pointed at the same job once one is confirmed reliable, so this one stands
# down. `workflow_dispatch` is kept so a test notification can still be fired by hand from the
# Actions tab if ever needed — it just doesn't happen automatically any more.
#
# If cron-job.org is ever unavailable and this needs to be the schedule again: GitHub was
# measured dropping roughly 85% of this workflow's scheduled runs outright over a 3-day span
# (see prior run history), so re-enabling it as a *sole* source of automatic delivery isn't
# recommended — pair it with a shorter, non-:00/:30 cron grid the way it was configured before,
# and lean on the due-check/catch-up logic to smooth over what still gets dropped.
on:
  workflow_dispatch: {}              # manual test only — see above for why there's no `schedule:` here

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger prescript notification
        run: |
          # --max-time bumped 60->90s and --retry-all-errors added after confirming in Render's
          # logs that a cold-started free-tier instance can 502 for the first several seconds
          # after waking up — a plain retry a few seconds later succeeds once it's actually ready,
          # instead of failing the whole run over what's really just "still booting." This only
          # helps once a run actually starts, though — see the catch-up note above for what
          # handles GitHub not starting the run at all.
          curl -sS --fail --max-time 90 --retry 2 --retry-delay 8 --retry-all-errors \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_TRIGGER_SECRET }}" \
            "${{ secrets.RENDER_APP_URL }}/notify/trigger/"
