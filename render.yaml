services:
  - type: web
    name: will-of-the-city
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn prescript_project.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      # Persistent storage (see settings.py DATABASES). Render's free web services have no disk
      # and spin down when idle, so the old plain-SQLite-file setup silently lost everything —
      # grace, history, and every PushSubscription — on each restart. Render injects the real
      # connection string at deploy time; it's never visible in this file, in chat, or in any
      # tool output. will-of-the-city-db is a free-tier Postgres instance that already exists —
      # this just formally links it. NOTE: Render's free Postgres plan expires 30 days after
      # creation (this one: created 2026-08-29, expires 2026-09-28) — see the accompanying
      # write-up for what to do before then.
      - key: DATABASE_URL
        fromDatabase:
          name: will-of-the-city-db
          property: connectionString
      # Phone push notifications (see .github/workflows/prescript-notify.yml) — set these
      # manually in the Render dashboard, they're not auto-generated.
      - key: NOTIFY_USERNAME
        sync: false
      - key: NOTIFY_TRIGGER_SECRET
        sync: false
      # Web Push (primary delivery path — see prescript_app/notify.py). Generate a VAPID keypair
      # yourself (README has the command) and set these manually; never auto-generate them here,
      # a new keypair invalidates every browser's existing push subscription.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      # ntfy.sh fallback (used only if a user has no Web Push subscription yet, or a push attempt
      # fails outright) — optional, set manually if you still want it.
      - key: NTFY_TOPIC
        sync: false
