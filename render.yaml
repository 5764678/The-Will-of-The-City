services:
  - type: web
    name: will-of-the-city
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn prescript_project.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      # Persistent storage (see settings.py DATABASES). Render's free web services have no disk
      # and spin down when idle, so the old plain-SQLite-file setup silently lost everything —
      # grace, history, and every PushSubscription — on each restart.
      #
      # Set this manually in the Render dashboard to a Neon Postgres connection string (Neon's
      # free tier never expires or deletes on a timer — it just suspends compute after idle and
      # auto-wakes on the next query, unlike Render's own free Postgres, which self-deletes 30
      # days after creation). Deliberately a plain manual var (not fromDatabase) so a future
      # blueprint sync can never silently overwrite whatever's actually pasted in here.
      - key: DATABASE_URL
        sync: false
      # Phone push notifications (see .github/workflows/prescript-notify.yml) — set these
      # manually in the Render dashboard, they're not auto-generated.
      - key: NOTIFY_USERNAME
        sync: false
      - key: NOTIFY_TRIGGER_SECRET
        sync: false
      # Web Push (primary delivery path — see prescript_app/notify.py). Generate a VAPID keypair
      # yourself (README has the command) and set these manually; never auto-generate them here,
      # a new keypair invalidates every browser's existing push subscription.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      # ntfy.sh fallback (used only if a user has no Web Push subscription yet, or a push attempt
      # fails outright) — optional, set manually if you still want it.
      - key: NTFY_TOPIC
        sync: false
